<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MATEMAATIKA 🔢</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#fff9f0;font-family:'Nunito',sans-serif;min-height:100vh;color:#2d2d2d;overflow-x:hidden;}
#root{min-height:100vh;}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-130px) rotate(720deg);opacity:0}}
@keyframes xpFloat{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.fadein{animation:fadeIn .35s ease both;}
.pop{animation:pop .3s ease both;}
.shake{animation:shake .4s ease;}
.bounce{animation:bounce 1.4s ease infinite;}
.btn{border:none;border-radius:18px;font-family:'Fredoka One',sans-serif;cursor:pointer;transition:transform .12s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.93);}
.btn:hover{filter:brightness(1.07);}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect, useRef} = React;

// ── Heli ─────────────────────────────────────────────────────────────────────
function playSound(type) {
  try {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (type === 'correct') {
      [[520,.0],[660,.13],[800,.26]].forEach(([f,t]) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(.25, ctx.currentTime+t);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+t+.2);
        o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.22);
      });
    } else if (type === 'wrong') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(220, ctx.currentTime);
      o.frequency.setValueAtTime(150, ctx.currentTime+.12);
      g.gain.setValueAtTime(.2, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.35);
      o.start(); o.stop(ctx.currentTime+.36);
    } else if (type === 'levelup') {
      [350,450,560,700,900].forEach((f,i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = f;
        g.gain.setValueAtTime(.22, ctx.currentTime+i*.1);
        g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+i*.1+.2);
        o.start(ctx.currentTime+i*.1); o.stop(ctx.currentTime+i*.1+.22);
      });
    } else if (type === 'flip') {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 520;
      g.gain.setValueAtTime(.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.1);
      o.start(); o.stop(ctx.currentTime+.11);
    }
  } catch(e) {}
}

// ── Numbrite sõnad eesti keeles ───────────────────────────────────────────────
const NUM_WORDS = [
  '','ÜKS','KAKS','KOLM','NELI','VIIS','KUUS','SEITSE','KAHEKSA','ÜHEKSA','KÜMME',
  'ÜKSTEIST','KAKSTEIST','KOLMTEIST','NELITEIST','VIISTEIST',
  'KUUSTEIST','SEITSETEIST','KAHEKSATEIST','ÜHEKSATEIST','KAKSKÜMMEND'
];

const NUM_EMOJI = [
  '','🍎','🍊','🍋','🍇','🍓','⭐','🌸','🐠','🦋','🐥',
  '🌺','🎈','🐶','🐱','🌈','🎵','🚀','🏆','🌟','🎉'
];

// ── XP süsteem ────────────────────────────────────────────────────────────────
const LEVELS = [
  {min:0,   name:'ALGAJA',      emoji:'🐣', color:'#94a3b8'},
  {min:30,  name:'ÕPPIJA',      emoji:'📚', color:'#51cf66'},
  {min:80,  name:'ARVELEJA',    emoji:'🧮', color:'#ffa94d'},
  {min:160, name:'MATEMAATIK',  emoji:'🏆', color:'#ff6b6b'},
  {min:280, name:'GEENIUS',     emoji:'🌟', color:'#cc5de8'},
];
function getLevel(xp) { let l=LEVELS[0]; for(const lv of LEVELS){if(xp>=lv.min)l=lv;} return l; }
function getNextLevel(xp) { for(const lv of LEVELS){if(xp<lv.min)return lv;} return null; }

// ── Tasemete seadistus ────────────────────────────────────────────────────────
const TASEMED = [
  {
    id:0, emoji:'🔢', nimi:'NUMBRID 1–20',
    kirjeldus:'ÕPI NUMBREID JA NENDE NIMETUSI',
    color:'#845ef7', bg:'#f3f0ff', tyyp:'numbrid'
  },
  {
    id:1, emoji:'🐣', nimi:'ALGAJA',
    kirjeldus:'LIITMINE JA LAHUTAMINE KUNI 12',
    color:'#ff6b6b', bg:'#fff5f5', tyyp:'aritmeetika',
    visuaal: true,
    ops: [
      {id:'liitmine',  silt:'LIITMINE ➕',   color:'#ff6b6b'},
      {id:'lahutamine',silt:'LAHUTAMINE ➖', color:'#f76707'},
    ],
    gen(op) {
      const useOp = op==='mõlemad' ? (Math.random()<.5?'liitmine':'lahutamine') : op;
      if (useOp==='liitmine') {
        const a = Math.floor(Math.random()*9)+1;
        const b = Math.floor(Math.random()*(12-a))+1;
        return {a, b, op:'+', vastus:a+b};
      } else {
        const vastus = Math.floor(Math.random()*9)+1;
        const b = Math.floor(Math.random()*(12-vastus))+1;
        return {a:vastus+b, b, op:'-', vastus};
      }
    }
  },
  {
    id:2, emoji:'🧮', nimi:'ARVELEJA',
    kirjeldus:'KORRUTAMINE JA JAGAMINE KUNI 50',
    color:'#51cf66', bg:'#f4fce3', tyyp:'aritmeetika',
    ops: [
      {id:'korrutamine',silt:'KORRUTAMINE ✖️', color:'#51cf66'},
      {id:'jagamine',   silt:'JAGAMINE ➗',    color:'#20c997'},
    ],
    gen(op) {
      const useOp = op==='mõlemad' ? (Math.random()<.5?'korrutamine':'jagamine') : op;
      if (useOp==='korrutamine') {
        const a = Math.floor(Math.random()*5)+1;
        const maxB = Math.floor(50/a);
        const b = Math.floor(Math.random()*maxB)+1;
        return {a, b, op:'×', vastus:a*b};
      } else {
        const b = Math.floor(Math.random()*5)+1;
        const vastus = Math.floor(Math.random()*Math.floor(50/b))+1;
        return {a:b*vastus, b, op:'÷', vastus};
      }
    }
  },
  {
    id:3, emoji:'🏆', nimi:'MATEMAATIK',
    kirjeldus:'KORRUTAMINE JA JAGAMINE KUNI 100',
    color:'#339af0', bg:'#e7f5ff', tyyp:'aritmeetika',
    ops: [
      {id:'korrutamine',silt:'KORRUTAMINE ✖️', color:'#339af0'},
      {id:'jagamine',   silt:'JAGAMINE ➗',    color:'#7048e8'},
    ],
    gen(op) {
      const useOp = op==='mõlemad' ? (Math.random()<.5?'korrutamine':'jagamine') : op;
      if (useOp==='korrutamine') {
        const a = Math.floor(Math.random()*9)+2;
        const maxB = Math.floor(100/a);
        const b = Math.floor(Math.random()*maxB)+1;
        return {a, b, op:'×', vastus:a*b};
      } else {
        const b = Math.floor(Math.random()*9)+2;
        const vastus = Math.floor(Math.random()*Math.floor(100/b))+1;
        return {a:b*vastus, b, op:'÷', vastus};
      }
    }
  },
];

// ── Väikesed komponendid ──────────────────────────────────────────────────────
function Confetti() {
  const it = ['⭐','🌟','✨','🎉','🎊','💫','🏆','🍎','🌸','🎈'];
  return (
    <div style={{position:'fixed',top:0,left:0,width:'100%',height:'100%',pointerEvents:'none',zIndex:9999,overflow:'hidden'}}>
      {Array.from({length:18}).map((_,i) => (
        <div key={i} style={{
          position:'absolute', left:`${4+i*5.5}%`, top:'12%',
          fontSize:`${16+Math.random()*20}px`,
          animation:`confetti ${.7+Math.random()*.9}s ease forwards`,
          animationDelay:`${i*.05}s`
        }}>{it[i%it.length]}</div>
      ))}
    </div>
  );
}

function XpPopup({amount, color}) {
  return (
    <div style={{
      position:'fixed',top:'35%',left:'50%',transform:'translateX(-50%)',
      background:color,color:'#fff',borderRadius:24,padding:'10px 28px',
      fontFamily:'Fredoka One',fontSize:24,zIndex:9998,pointerEvents:'none',
      animation:'xpFloat 1.1s ease forwards',boxShadow:'0 4px 20px rgba(0,0,0,.18)'
    }}>+{amount} XP ✨</div>
  );
}

function LevelBar({xp}) {
  const lv = getLevel(xp);
  const nx = getNextLevel(xp);
  const pct = nx ? Math.round(((xp-lv.min)/(nx.min-lv.min))*100) : 100;
  return (
    <div style={{background:'#fff',borderBottom:'2px solid #f1f3f5',padding:'8px 16px',display:'flex',alignItems:'center',gap:10}}>
      <span style={{fontSize:22}}>{lv.emoji}</span>
      <div style={{flex:1}}>
        <div style={{display:'flex',justifyContent:'space-between',fontFamily:'Fredoka One',fontSize:11,marginBottom:4}}>
          <span style={{color:lv.color}}>{lv.name}</span>
          <span style={{color:'#adb5bd'}}>{xp} XP{nx?` → ${nx.min}`:''}</span>
        </div>
        <div style={{height:8,background:'#e9ecef',borderRadius:4,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${pct}%`,background:lv.color,borderRadius:4,transition:'width .6s'}}/>
        </div>
      </div>
      {nx&&<span style={{fontSize:18}}>{nx.emoji}</span>}
    </div>
  );
}

function Apples({n}) {
  if (!n || n > 12) return null;
  const em = ['🍎','🍊','🍋','🍇','🍓','⭐'];
  const icon = em[n % em.length];
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center',maxWidth:200,margin:'0 auto 8px'}}>
      {Array.from({length:n}).map((_,i) => (
        <span key={i} style={{fontSize:22,animation:`pop .15s ease ${i*.04}s both`}}>{icon}</span>
      ))}
    </div>
  );
}

// ── Numbrite ekraan ───────────────────────────────────────────────────────────
function NumbersLevel({onXp, onBack}) {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [showConf, setShowConf] = useState(false);
  const n = idx + 1;

  function goNext() {
    playSound('flip');
    setFlipped(false);
    setTimeout(() => {
      if (idx < 19) { setIdx(i => i+1); }
      else { setShowConf(true); onXp(20,'#845ef7'); setTimeout(() => { setShowConf(false); onBack(); }, 2500); }
    }, 80);
  }
  function goPrev() {
    playSound('flip');
    setFlipped(false);
    setTimeout(() => setIdx(i => Math.max(0,i-1)), 80);
  }

  return (
    <div className="fadein" style={{padding:16,maxWidth:420,margin:'0 auto'}}>
      {showConf && <Confetti/>}

      <div style={{textAlign:'center',marginBottom:18}}>
        <div style={{fontFamily:'Fredoka One',fontSize:15,color:'#845ef7',marginBottom:6}}>
          NUMBER {idx+1} / 20
        </div>
        <div style={{height:8,background:'#e9ecef',borderRadius:4,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${((idx+1)/20)*100}%`,background:'#845ef7',borderRadius:4,transition:'width .4s'}}/>
        </div>
      </div>

      <div
        onClick={() => { setFlipped(f => !f); playSound('flip'); }}
        style={{
          background:'#fff', borderRadius:32, padding:'32px 20px',
          textAlign:'center', boxShadow:'0 8px 32px rgba(132,94,247,.15)',
          border:'3px solid #845ef7', cursor:'pointer', userSelect:'none',
          minHeight:270, display:'flex', flexDirection:'column',
          alignItems:'center', justifyContent:'center', gap:12
        }}>
        <div style={{fontFamily:'Fredoka One',fontSize:90,color:'#845ef7',lineHeight:1}} key={idx}>
          {n}
        </div>
        {flipped ? (
          <div className="pop" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10}}>
            <div style={{fontFamily:'Fredoka One',fontSize:34,color:'#845ef7'}}>{NUM_WORDS[n]}</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:4,justifyContent:'center',maxWidth:220}}>
              {Array.from({length:n}).map((_,i) => (
                <span key={i} style={{fontSize:24,animation:`pop .15s ease ${i*.04}s both`}}>
                  {NUM_EMOJI[n]}
                </span>
              ))}
            </div>
          </div>
        ) : (
          <div style={{fontFamily:'Fredoka One',fontSize:15,color:'#ced4da'}}>
            👆 PUUDUTA ET NÄHA
          </div>
        )}
      </div>

      <div style={{display:'flex',gap:12,marginTop:18}}>
        <button className="btn" onClick={goPrev} disabled={idx===0}
          style={{
            flex:1, padding:'16px',
            background:idx===0?'#f1f3f5':'#f3f0ff',
            color:idx===0?'#adb5bd':'#845ef7',
            fontFamily:'Fredoka One', fontSize:16
          }}>← EELMINE</button>
        <button className="btn" onClick={goNext}
          style={{
            flex:2, padding:'16px',
            background:'#845ef7', color:'#fff',
            fontFamily:'Fredoka One', fontSize:16,
            boxShadow:'0 4px 18px #845ef740'
          }}>{idx < 19 ? 'JÄRGMINE →' : '✅ VALMIS!'}</button>
      </div>
      <div style={{textAlign:'center',marginTop:10,fontFamily:'Fredoka One',fontSize:12,color:'#ced4da'}}>
        PUUDUTA KAARTI ET NÄHA SÕNA JA PILTE
      </div>
    </div>
  );
}

// ── Aritmeetika ekraan ────────────────────────────────────────────────────────
function ArithmeticLevel({tase, op, onXp, onBack}) {
  const TOTAL = 10;
  const opConf = op === 'mõlemad'
    ? {id:'mõlemad', silt:'MÕLEMAD', color:tase.color}
    : tase.ops.find(o => o.id === op);

  const [questions] = useState(() => Array.from({length:TOTAL}, () => tase.gen(op)));
  const [current, setCurrent] = useState(0);
  const [valikud, setValikud] = useState(null);
  const [valitud, setValitud] = useState(null);
  const [animState, setAnimState] = useState(null);
  const [oiged, setOiged] = useState(0);
  const [done, setDone] = useState(false);
  const [showConf, setShowConf] = useState(false);
  const [streak, setStreak] = useState(0);
  const [maxStreak, setMaxStreak] = useState(0);
  const [xpPopup, setXpPopup] = useState(null);
  const doneOiged = useRef(0);

  const q = questions[current];

  useEffect(() => {
    if (!q) return;
    const correct = q.vastus;
    const pool = new Set([correct]);
    let tries = 0;
    while (pool.size < 4 && tries < 50) {
      tries++;
      const delta = Math.floor(Math.random()*6)-3;
      const v = correct + delta;
      if (v > 0 && v !== correct) pool.add(v);
    }
    // fill if not enough
    let extra = 1;
    while (pool.size < 4) { if (correct+extra > 0 && !pool.has(correct+extra)) pool.add(correct+extra); extra++; }
    setValikud([...pool].sort(() => Math.random()-.5));
    setValitud(null);
    setAnimState(null);
  }, [current]);

  function vali(v) {
    if (valitud !== null) return;
    setValitud(v);
    const correct = v === q.vastus;
    if (correct) {
      playSound('correct');
      setAnimState('correct');
      doneOiged.current += 1;
      setOiged(doneOiged.current);
      const ns = streak + 1;
      setStreak(ns);
      setMaxStreak(m => Math.max(m, ns));
      const xpAmt = ns >= 3 ? 3 : 2;
      onXp(xpAmt, opConf.color);
      setXpPopup({amount:xpAmt, color:opConf.color});
      setTimeout(() => setXpPopup(null), 1000);
    } else {
      playSound('wrong');
      setAnimState('wrong');
      setStreak(0);
    }
    setTimeout(() => {
      if (current + 1 < TOTAL) {
        setCurrent(c => c+1);
      } else {
        setDone(true);
        if (doneOiged.current >= 8) { playSound('levelup'); setShowConf(true); setTimeout(() => setShowConf(false), 2600); }
      }
    }, 950);
  }

  if (done) {
    const score = doneOiged.current;
    return (
      <div className="fadein" style={{padding:16,maxWidth:420,margin:'0 auto',textAlign:'center'}}>
        {showConf && <Confetti/>}
        <div style={{
          background:'#fff', borderRadius:32, padding:36,
          boxShadow:'0 8px 32px rgba(0,0,0,.1)',
          border:`3px solid ${score>=8?'#51cf66':'#ffa94d'}`
        }}>
          <div style={{fontSize:72,marginBottom:8}}>
            {score===10?'🏆':score>=8?'🌟':score>=6?'👍':'💪'}
          </div>
          <div style={{fontFamily:'Fredoka One',fontSize:56,color:score>=8?'#51cf66':'#ffa94d'}}>
            {score}/{TOTAL}
          </div>
          <div style={{fontFamily:'Fredoka One',fontSize:20,color:'#495057',marginTop:8}}>
            {score===10?'SUUREPÄRANE! KÕIK ÕIGE!':score>=8?'VÄGA HEA TÖÖ!':score>=6?'HÄSTI TEHTUD!':'HARJUTA VEEL!'}
          </div>
          {maxStreak >= 3 && (
            <div style={{marginTop:12,fontFamily:'Fredoka One',fontSize:16,color:'#ffa94d'}}>
              🔥 PARIM SEERIA: {maxStreak} JÄRJEST!
            </div>
          )}
          <div style={{display:'flex',gap:12,marginTop:28}}>
            <button className="btn" onClick={onBack}
              style={{flex:1,padding:'14px',background:'#f1f3f5',color:'#868e96',fontFamily:'Fredoka One',fontSize:15}}>
              ← TAGASI
            </button>
            <button className="btn"
              onClick={() => {
                doneOiged.current = 0;
                setCurrent(0); setValikud(null); setValitud(null);
                setAnimState(null); setOiged(0); setDone(false);
                setStreak(0); setMaxStreak(0); setShowConf(false);
              }}
              style={{
                flex:2,padding:'14px',
                background:opConf.color,color:'#fff',
                fontFamily:'Fredoka One',fontSize:15,
                boxShadow:`0 4px 16px ${opConf.color}50`
              }}>🔄 UUESTI</button>
          </div>
        </div>
      </div>
    );
  }

  if (!valikud || !q) return null;

  return (
    <div className="fadein" style={{padding:16,maxWidth:420,margin:'0 auto'}}>
      {xpPopup && <XpPopup amount={xpPopup.amount} color={xpPopup.color}/>}

      {/* Edenemisriba */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <div style={{flex:1,height:8,background:'#e9ecef',borderRadius:4,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${(current/TOTAL)*100}%`,background:opConf.color,borderRadius:4,transition:'width .4s'}}/>
        </div>
        <div style={{fontFamily:'Fredoka One',fontSize:14,color:'#adb5bd'}}>{current}/{TOTAL}</div>
        {streak >= 2 && <div style={{fontFamily:'Fredoka One',fontSize:14,color:'#ffa94d'}}>🔥{streak}</div>}
      </div>

      {/* Punktid */}
      <div style={{display:'flex',justifyContent:'center',gap:5,marginBottom:14}}>
        {Array.from({length:TOTAL}).map((_,i) => (
          <div key={i} style={{
            width:9,height:9,borderRadius:'50%',
            background: i < current
              ? (i < oiged ? opConf.color : '#ff6b6b')
              : (i === current ? opConf.color+'60' : '#e9ecef'),
            transition:'background .3s'
          }}/>
        ))}
      </div>

      {/* Küsimus */}
      <div
        className={animState==='wrong'?'shake':''}
        style={{
          background:'#fff', borderRadius:28, padding:'28px 20px',
          textAlign:'center', boxShadow:'0 8px 28px rgba(0,0,0,.08)',
          marginBottom:18,
          border:`3px solid ${animState==='correct'?'#51cf66':animState==='wrong'?'#ff6b6b':opConf.color+'35'}`,
          transition:'border-color .2s'
        }}>
        {tase.visuaal && valitud === null && (
          <div style={{marginBottom:14}}>
            <Apples n={q.a}/>
            {q.op === '+' && <Apples n={q.b}/>}
          </div>
        )}
        <div style={{fontFamily:'Fredoka One',fontSize:52,color:'#2d2d2d',letterSpacing:2}}>
          {q.a} {q.op} {q.b} = ?
        </div>
        {animState === 'correct' && (
          <div style={{fontFamily:'Fredoka One',fontSize:22,color:'#51cf66',marginTop:10}}>
            ✅ ÕIGE! = {q.vastus}
          </div>
        )}
        {animState === 'wrong' && (
          <div style={{fontFamily:'Fredoka One',fontSize:22,color:'#ff6b6b',marginTop:10}}>
            ❌ VALE! VASTUS ON {q.vastus}
          </div>
        )}
      </div>

      {/* Valikud */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        {valikud.map(v => {
          let bg = '#fff', border = `2px solid ${opConf.color}30`, tc = '#2d2d2d';
          if (valitud !== null) {
            if (v === q.vastus) { bg='#d3f9d8'; border='2px solid #51cf66'; tc='#2f9e44'; }
            else if (v === valitud) { bg='#ffe3e3'; border='2px solid #ff6b6b'; tc='#c92a2a'; }
          }
          return (
            <button key={v} className="btn" onClick={() => vali(v)} disabled={valitud !== null}
              style={{
                padding:'20px 12px',background:bg,border,color:tc,
                fontFamily:'Fredoka One',fontSize:36,borderRadius:20,
                boxShadow:'0 2px 8px rgba(0,0,0,.06)',
                cursor:valitud!==null?'default':'pointer',
                transition:'all .2s'
              }}>
              {v}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ── Tehte valik ───────────────────────────────────────────────────────────────
function OpSelect({tase, onSelect, onBack}) {
  return (
    <div className="fadein" style={{padding:16,maxWidth:420,margin:'0 auto'}}>
      <div style={{textAlign:'center',marginBottom:28,paddingTop:8}}>
        <div style={{fontSize:60,marginBottom:8}}>{tase.emoji}</div>
        <div style={{fontFamily:'Fredoka One',fontSize:26,color:tase.color}}>{tase.nimi}</div>
        <div style={{fontFamily:'Fredoka One',fontSize:13,color:'#adb5bd',marginTop:4}}>{tase.kirjeldus}</div>
      </div>
      <div style={{fontFamily:'Fredoka One',fontSize:17,color:'#495057',textAlign:'center',marginBottom:16}}>
        VALI TEHTE LIIK:
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14,marginBottom:16}}>
        {tase.ops.map(op => (
          <button key={op.id} className="btn" onClick={() => onSelect(op.id)}
            style={{
              padding:'22px', background:op.color, color:'#fff',
              fontFamily:'Fredoka One', fontSize:22,
              boxShadow:`0 6px 22px ${op.color}50`, borderRadius:22
            }}>{op.silt}</button>
        ))}
        <button className="btn" onClick={() => onSelect('mõlemad')}
          style={{
            padding:'22px', background:'#fff', color:tase.color,
            fontFamily:'Fredoka One', fontSize:22, borderRadius:22,
            border:`3px solid ${tase.color}`,
            boxShadow:`0 4px 16px ${tase.color}25`
          }}>🎲 MÕLEMAD SEGAMINI</button>
      </div>
      <button className="btn" onClick={onBack}
        style={{width:'100%',padding:'14px',background:'#f1f3f5',color:'#868e96',fontFamily:'Fredoka One',fontSize:15}}>
        ← TAGASI
      </button>
    </div>
  );
}

// ── Avaleht ───────────────────────────────────────────────────────────────────
function Home({xp, onSelect}) {
  const lv = getLevel(xp);
  return (
    <div className="fadein" style={{padding:16,maxWidth:420,margin:'0 auto'}}>
      <div style={{textAlign:'center',padding:'24px 0 22px'}}>
        <div style={{fontSize:60,marginBottom:6}} className="bounce">🔢</div>
        <div style={{fontFamily:'Fredoka One',fontSize:32,color:'#2d2d2d',letterSpacing:1}}>MATEMAATIKA</div>
        <div style={{fontFamily:'Fredoka One',fontSize:14,color:'#adb5bd',marginTop:4}}>VALI TASE JA ALUSTA!</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {TASEMED.map(t => (
          <button key={t.id} className="btn" onClick={() => onSelect(t)}
            style={{
              width:'100%', padding:'20px 22px',
              background:t.bg, border:`3px solid ${t.color}`,
              color:t.color, borderRadius:24,
              boxShadow:`0 6px 22px ${t.color}20`,
              flexDirection:'column', gap:4, alignItems:'flex-start'
            }}>
            <div style={{display:'flex',alignItems:'center',gap:14,width:'100%'}}>
              <span style={{fontSize:38}}>{t.emoji}</span>
              <div style={{textAlign:'left'}}>
                <div style={{fontFamily:'Fredoka One',fontSize:20}}>{t.nimi}</div>
                <div style={{fontFamily:'Nunito',fontWeight:800,fontSize:13,color:`${t.color}aa`,marginTop:2}}>
                  {t.kirjeldus}
                </div>
              </div>
            </div>
          </button>
        ))}
      </div>
      <div style={{textAlign:'center',marginTop:20,fontFamily:'Fredoka One',fontSize:13,color:'#adb5bd'}}>
        {lv.emoji} SINU TASE: {lv.name} · {xp} XP
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [selTase, setSelTase] = useState(null);
  const [selOp, setSelOp] = useState(null);
  const [xp, setXp] = useState(() => parseInt(localStorage.getItem('mat_xp')||'0'));
  const [xpPopup, setXpPopup] = useState(null);
  const [showConf, setShowConf] = useState(false);

  function addXp(amount, color) {
    setXp(prev => {
      const next = prev + amount;
      localStorage.setItem('mat_xp', next);
      if (getLevel(next).min > getLevel(prev).min) {
        playSound('levelup'); setShowConf(true);
        setTimeout(() => setShowConf(false), 2600);
      }
      return next;
    });
    setXpPopup({amount, color});
    setTimeout(() => setXpPopup(null), 1100);
  }

  function selectTase(t) {
    setSelTase(t);
    if (t.tyyp === 'numbrid') setScreen('game');
    else setScreen('opselect');
  }

  function goBack() {
    if (screen === 'game' && selTase?.tyyp !== 'numbrid') setScreen('opselect');
    else setScreen('home');
  }

  const headerTitle = screen === 'home' ? '🔢 MATEMAATIKA'
    : screen === 'opselect' ? `${selTase?.emoji} ${selTase?.nimi}`
    : `${selTase?.emoji} ${selTase?.nimi}`;

  return (
    <div style={{minHeight:'100vh',background:'#fff9f0'}}>
      {showConf && <Confetti/>}
      {xpPopup && screen !== 'game' && <XpPopup amount={xpPopup.amount} color={xpPopup.color}/>}

      {/* Header */}
      <div style={{background:'#fff',boxShadow:'0 2px 12px rgba(0,0,0,.07)',position:'sticky',top:0,zIndex:100}}>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'12px 16px',borderBottom:'1px solid #f1f3f5'}}>
          {screen !== 'home' && (
            <button className="btn" onClick={goBack}
              style={{background:'#f1f3f5',color:'#495057',padding:'8px 16px',fontFamily:'Fredoka One',fontSize:15}}>←</button>
          )}
          <div style={{flex:1,fontFamily:'Fredoka One',fontSize:20,color:'#2d2d2d'}}>{headerTitle}</div>
        </div>
        <LevelBar xp={xp}/>
      </div>

      {screen === 'home' && <Home xp={xp} onSelect={selectTase}/>}

      {screen === 'opselect' && selTase && (
        <OpSelect tase={selTase} onSelect={op => { setSelOp(op); setScreen('game'); }} onBack={() => setScreen('home')}/>
      )}

      {screen === 'game' && selTase?.tyyp === 'numbrid' && (
        <NumbersLevel onXp={addXp} onBack={() => setScreen('home')}/>
      )}

      {screen === 'game' && selTase?.tyyp === 'aritmeetika' && selOp && (
        <ArithmeticLevel
          key={`${selTase.id}-${selOp}-${screen}`}
          tase={selTase}
          op={selOp}
          onXp={addXp}
          onBack={() => setScreen('opselect')}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
