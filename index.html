<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:linear-gradient(160deg,#fff0fa 0%,#f0f4ff 50%,#f0fff8 100%);background-attachment:fixed;font-family:'Nunito',sans-serif;min-height:100vh;color:#2d2d2d;overflow-x:hidden;}
@keyframes pop{0%{transform:scale(0);opacity:0}70%{transform:scale(1.18)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(-160px) rotate(800deg);opacity:0}}
@keyframes xpFloat{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-80px) scale(1.2);opacity:0}}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes starPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}}
@keyframes float{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}
.fadein{animation:fadeIn .35s ease both;}
.shake-el{animation:shake .4s ease;}
.bounce{animation:bounceY 1.6s ease infinite;}
.wiggle{animation:wiggle .6s ease;}
button{border:none;border-radius:20px;font-family:'Fredoka One',sans-serif;cursor:pointer;transition:transform .13s,box-shadow .13s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
button:active{transform:scale(.91);}
button:hover{transform:translateY(-2px);}
#app{min-height:100vh;}
.header{background:rgba(255,255,255,.85);backdrop-filter:blur(12px);box-shadow:0 2px 16px rgba(180,120,220,.12);position:sticky;top:0;z-index:100;}
.header-top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(180,120,220,.12);}
.level-bar{background:transparent;border-bottom:1px solid rgba(180,120,220,.1);padding:8px 16px;display:flex;align-items:center;gap:10;}
.screen{padding:16px;max-width:420px;margin:0 auto;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.answer-btn{padding:18px 12px;background:#fff;border:3px solid rgba(0,0,0,.07);color:#2d2d2d;font-family:'Fredoka One',sans-serif;font-size:32px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.08);transition:all .18s;width:100%;}
.answer-btn:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.12);}
.deco{position:fixed;pointer-events:none;z-index:0;font-size:28px;opacity:.13;animation:float 4s ease infinite;}
</style>
</head>

function playSound(type) {
  try {
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    if (type==='correct') {
      [[520,.0],[660,.13],[800,.26]].forEach(function(pair) {
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value=pair[0];
        g.gain.setValueAtTime(.25,ctx.currentTime+pair[1]);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+pair[1]+.2);
        o.start(ctx.currentTime+pair[1]); o.stop(ctx.currentTime+pair[1]+.22);
      });
    } else if (type==='wrong') {
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.setValueAtTime(220,ctx.currentTime);
      o.frequency.setValueAtTime(150,ctx.currentTime+.12);
      g.gain.setValueAtTime(.2,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
      o.start(); o.stop(ctx.currentTime+.36);
    } else if (type==='levelup') {
      [350,450,560,700,900].forEach(function(f,i) {
        var o=ctx.createOscillator(), g=ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value=f;
        g.gain.setValueAtTime(.22,ctx.currentTime+i*.1);
        g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.1+.2);
        o.start(ctx.currentTime+i*.1); o.stop(ctx.currentTime+i*.1+.22);
      });
    } else if (type==='flip') {
      var o=ctx.createOscillator(), g=ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value=520;
      g.gain.setValueAtTime(.1,ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.1);
      o.start(); o.stop(ctx.currentTime+.11);
    }
  } catch(e) {}
}

function getLevel(xp) { var l=LEVELS[0]; LEVELS.forEach(function(lv){if(xp>=lv.min)l=lv;}); return l; }
function getNextLevel(xp) { for(var i=0;i<LEVELS.length;i++){if(xp<LEVELS[i].min)return LEVELS[i];} return null; }

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  var app = document.getElementById('app');
  app.innerHTML = '';

  var lv = getLevel(state.xp);
  var nx = getNextLevel(state.xp);
  var pct = nx ? Math.round(((state.xp-lv.min)/(nx.min-lv.min))*100) : 100;

  // Header
  var hdr = document.createElement('div');
  hdr.className = 'header';
  var title = state.screen==='home' ? '🔢 MATEMAATIKA'
    : state.screen==='opselect' ? state.selTase.emoji+' '+state.selTase.nimi
    : (state.numSubscreen==='kuula' ? '📖 LOE JA VALI'
    : state.numSubscreen==='loen' ? '🍎 LOEN KOKKU'
    : state.selTase.emoji+' '+state.selTase.nimi);

  hdr.innerHTML = '<div class="header-top">'
    +(state.screen!=='home'?'<button onclick="goBack()" style="background:#f1f3f5;color:#495057;padding:8px 16px;font-size:15px;">←</button>':'')
    +'<div style="flex:1;font-family:\'Fredoka One\',sans-serif;font-size:20px;color:#2d2d2d;">'+title+'</div>'
    +'</div>'
    +'<div class="level-bar">'
    +'<span style="font-size:22px;">'+lv.emoji+'</span>'
    +'<div style="flex:1;">'
    +'<div style="display:flex;justify-content:space-between;font-family:\'Fredoka One\',sans-serif;font-size:11px;margin-bottom:4px;">'
    +'<span style="color:'+lv.color+';">'+lv.name+'</span>'
    +'<span style="color:#adb5bd;">'+state.xp+' XP'+(nx?' → '+nx.min:'')+'</span>'
    +'</div>'
    +'<div style="height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;">'
    +'<div style="height:100%;width:'+pct+'%;background:'+lv.color+';border-radius:4px;transition:width .6s;"></div>'
    +'</div>'
    +'</div>'
    +(nx?'<span style="font-size:18px;">'+nx.emoji+'</span>':'')
    +'</div>';
  app.appendChild(hdr);

  // Confetti
  if (state.showConf) {
    var cf = document.createElement('div');
    cf.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;overflow:hidden;';
    var items = ['⭐','🌟','✨','🎉','🎊','💫','🏆','🍎','🌸','🎈'];
    for (var i=0;i<18;i++) {
      var p = document.createElement('div');
      p.style.cssText = 'position:absolute;left:'+(4+i*5.5)+'%;top:12%;font-size:'+(16+Math.random()*18)+'px;animation:confetti '+(0.7+Math.random()*.9)+'s ease forwards;animation-delay:'+(i*.05)+'s;';
      p.textContent = items[i%items.length];
      cf.appendChild(p);
    }
    app.appendChild(cf);
  }

  // Screen content
  if (state.screen==='home') renderHome(app);
  else if (state.screen==='opselect') renderOpSelect(app);
  else if (state.screen==='game' && state.selTase.tyyp==='numbrid' && !state.numSubscreen) renderNumSelect(app);
  else if (state.screen==='game' && state.selTase.tyyp==='numbrid' && state.numSubscreen==='kaardid') renderNumbers(app);
  else if (state.screen==='game' && state.selTase.tyyp==='numbrid' && state.numSubscreen==='loen') renderLoen(app);
  else if (state.screen==='game' && state.selTase.tyyp==='numbrid' && state.numSubscreen==='kuula') renderKuula(app);
  else if (state.screen==='game' && state.selTase.tyyp==='aritmeetika') renderArithmetic(app);
}

function loenRange() { var g=getNumGroup(); return {from:g.from,to:g.to}; }

function makeLoenQ() {
  var gr=getNumGroup();
  var vastus = gr.from + Math.floor(Math.random()*(gr.to-gr.from+1));
  var pool = [vastus];
  var tries=0;
  while (pool.length<4 && tries<60) {
    tries++;
    var delta = Math.floor(Math.random()*6)-3;
    var v = vastus+delta;
    if (v>0 && v<=20 && pool.indexOf(v)===-1) pool.push(v);
  }
  var extra=1;
  while (pool.length<4) {
    if (pool.indexOf(vastus+extra)===-1 && vastus+extra<=20) pool.push(vastus+extra);
    else if (pool.indexOf(vastus-extra)===-1 && vastus-extra>0) pool.push(vastus-extra);
    extra++;
  }
  var FRUIT_SETS = [
    {emoji:'🍎',name:'ÕUNAD'},
    {emoji:'🍊',name:'APELSINID'},
    {emoji:'🍋',name:'SIDRUNID'},
    {emoji:'🍓',name:'MAASIKAD'},
    {emoji:'🍇',name:'VIINAMARJAD'},
    {emoji:'⭐',name:'TÄHEKESED'},
    {emoji:'🌸',name:'LILLED'},
    {emoji:'🐠',name:'KALAD'},
    {emoji:'🦋',name:'LIBLIKAD'},
    {emoji:'🐥',name:'TIBUD'},
  ];
  var fruit = FRUIT_SETS[Math.floor(Math.random()*FRUIT_SETS.length)];
  state.loenQ = {vastus: vastus, emoji: fruit.emoji, name: fruit.name};
  state.loenValikud = pool.sort(function(){return Math.random()-.5;});
  state.loenValitud = null;
  state.loenAnimState = null;
}

function valiLoen(v) {
  if (state.loenValitud !== null) return;
  state.loenValitud = v;
  var correct = v === state.loenQ.vastus;
  if (correct) {
    playSound('correct'); state.loenAnimState='correct'; state.loenOiged++;
    var ns=state.loenStreak+1; state.loenStreak=ns;
    if (ns>state.loenMaxStreak) state.loenMaxStreak=ns;
    addXp(ns>=3?3:2,'#ff6b9d');
  } else {
    playSound('wrong'); state.loenAnimState='wrong'; state.loenStreak=0;
  }
  render();
  setTimeout(function(){
    state.loenCurrent++;
    if (state.loenCurrent<10) { makeLoenQ(); render(); }
    else {
      state.loenDone=true;
      if (state.loenOiged>=8) { playSound('levelup'); state.showConf=true; if(state.confTimer)clearTimeout(state.confTimer); state.confTimer=setTimeout(function(){state.showConf=false;render();},2600); }

    }
  }, 1000);
}

      if (v===state.kuulaQ.number) { bg='linear-gradient(135deg,#d3f9d8,#b8f0c4)'; border='3px solid #51cf66'; tc='#1a7a36'; }
      else if (v===state.kuulaValitud) { bg='linear-gradient(135deg,#ffe3e3,#ffc8c8)'; border='3px solid #ff6b6b'; tc='#c92a2a'; }
      else { bg='#f8f8f8'; border='3px solid #e9ecef'; tc='#adb5bd'; }
    }
    var icon = (state.kuulaValitud===null) ? kuulaEmojis[vi] : (v===state.kuulaQ.number?'✅':(v===state.kuulaValitud?'❌':''));
    html += '<button onclick="valiKuula('+v+')" '+(state.kuulaValitud!==null?'disabled':'')+' style="width:100%;padding:14px 20px;background:'+bg+';border:'+border+';color:'+tc+';box-shadow:0 4px 14px rgba(0,0,0,.1);border-radius:18px;display:flex;align-items:center;gap:14px;">'
      +'<span style="font-size:24px;">'+icon+'</span>'
      +'<span style="font-family:\'Fredoka One\',sans-serif;font-size:22px;letter-spacing:1px;">'+NUM_WORDS[v]+'</span>'
      +'</button>';
  });
  html += '</div>';

  div.innerHTML = html;
  app.appendChild(div);
}

function renderNumbers(app) {
  var g = getNumGroup();
  var idx = state.numIdx;
  var n = idx;
  var flipped = state.numFlipped;
  var total = g.to - g.from + 1;
  var pos = idx - g.from + 1;
  var div = document.createElement('div');
  div.className = 'screen fadein';
  var pct = (pos/total)*100;
  var html = '<div style="text-align:center;margin-bottom:18px;">'
    +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:15px;color:#845ef7;margin-bottom:6px;">'+g.label+' — '+pos+' / '+total+'</div>'
    +'<div style="height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;">'
    +'<div style="height:100%;width:'+pct+'%;background:#845ef7;border-radius:4px;transition:width .4s;"></div>'
    +'</div></div>'
    +'<div onclick="flipCard()" style="background:#fff;border-radius:32px;padding:32px 20px;text-align:center;box-shadow:0 8px 32px rgba(132,94,247,.15);border:3px solid #845ef7;cursor:pointer;user-select:none;min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">'
    +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:90px;color:#845ef7;line-height:1;">'+n+'</div>';
  if (flipped) {
    html += '<div style="animation:pop .3s ease both;">'
      +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:'+(NUM_WORDS[n].length>14?22:NUM_WORDS[n].length>10?26:32)+'px;color:#845ef7;margin-bottom:10px;">'+NUM_WORDS[n]+'</div>';
    if (n<=20) {
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:220px;">';
      for (var i=0;i<n;i++) {
        html += '<span style="font-size:20px;animation:pop .12s ease '+(i*.03)+'s both;">'+NUM_EMOJI[n]+'</span>';
      }
      html += '</div>';
    }
    html += '</div>';
  } else {
    html += '<div style="font-family:\'Fredoka One\',sans-serif;font-size:15px;color:#ced4da;">👆 PUUDUTA ET NÄHA</div>';
  }
  html += '</div>'
    +'<div style="display:flex;gap:12px;margin-top:18px;">'
    +'<button onclick="numPrev()" '+(idx<=g.from?'disabled':'')+' style="flex:1;padding:16px;background:'+(idx<=g.from?'#f1f3f5':'#f3f0ff')+';color:'+(idx<=g.from?'#adb5bd':'#845ef7')+';font-family:\'Fredoka One\',sans-serif;font-size:16px;">← EELMINE</button>'
    +'<button onclick="numNext()" style="flex:2;padding:16px;background:#845ef7;color:#fff;font-family:\'Fredoka One\',sans-serif;font-size:16px;box-shadow:0 4px 18px #845ef740;">'+(idx<g.to?'JÄRGMINE →':'✅ VALMIS!')+'</button>'
    +'</div>'
    +'<div style="text-align:center;margin-top:10px;font-family:\'Fredoka One\',sans-serif;font-size:12px;color:#ced4da;">PUUDUTA KAARTI ET NÄHA SÕNA JA PILTE</div>';
  div.innerHTML = html;
  app.appendChild(div);
}

function renderArithmetic(app) {
  var t = state.selTase;
  var op = state.selOp;
  var opConf = op==='mõlemad' ? {id:'mõlemad',silt:'MÕLEMAD',color:t.color} : t.ops.find(function(o){return o.id===op;});
  var TOTAL = 10;

  if (state.done) {
    var score = state.oiged;
    var div = document.createElement('div');
    div.className = 'screen fadein';
    var resultEmoji = score===10?'🏆':score>=8?'🌟':score>=6?'🎉':'💪';
    var resultAnimals = score===10?'🐱🐶🦊🐸🦄':'🦋🌸⭐🌈';
    var resultBg = score>=8
      ? 'linear-gradient(135deg,#d3f9d8,#b8f5c8)'
      : score>=6 ? 'linear-gradient(135deg,#fff3cd,#ffe89a)'
      : 'linear-gradient(135deg,#ffe4ec,#ffd0dc)';
    var resultBorder = score>=8?'#51cf66':score>=6?'#ffa94d':'#ff8fab';
    div.innerHTML = '<div style="background:'+resultBg+';border-radius:36px;padding:36px 28px;box-shadow:0 12px 40px rgba(0,0,0,.12);border:4px solid '+resultBorder+';text-align:center;">'
      +'<div style="font-size:80px;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));">'+resultEmoji+'</div>'
      +'<div style="font-size:28px;margin-bottom:12px;letter-spacing:4px;">'+resultAnimals+'</div>'
      +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:64px;color:'+(score>=8?'#2a9e4f':score>=6?'#c87a00':'#c92a2a')+';">'+score+'/'+TOTAL+'</div>'
      +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:22px;color:#3d2c5e;margin-top:8px;">'+(score===10?'SUUREPÄRANE! 🎊':score>=8?'VÄGA HEA TÖÖ! 🌟':score>=6?'HÄSTI TEHTUD! 👏':'HARJUTA VEEL! 💪')+'</div>'
      +(state.maxStreak>=3?'<div style="margin-top:14px;padding:10px 20px;background:rgba(255,255,255,.6);border-radius:16px;display:inline-block;font-family:\'Fredoka One\',sans-serif;font-size:16px;color:#e67700;">🔥 PARIM SEERIA: '+state.maxStreak+' JÄRJEST!</div>':'')
      +'<div style="display:flex;gap:12px;margin-top:28px;">'
      +'<button onclick="goBack()" style="flex:1;padding:14px;background:rgba(255,255,255,.7);color:#7a6a8a;font-family:\'Fredoka One\',sans-serif;font-size:15px;border-radius:18px;border:2px solid rgba(255,255,255,.9);">← TAGASI</button>'
      +'<button onclick="restartGame()" style="flex:2;padding:14px;background:'+opConf.color+';color:#fff;font-family:\'Fredoka One\',sans-serif;font-size:15px;border-radius:18px;box-shadow:0 6px 20px '+opConf.color+'60;">🔄 UUESTI</button>'
      +'</div></div>';
    app.appendChild(div);
    return;
  }

  var q = state.questions[state.current];
  if (!q || !state.valikud.length) return;

  var div = document.createElement('div');
  div.className = 'screen fadein';

  // Progress bar
  var html = '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">'
    +'<div style="flex:1;height:8px;background:#e9ecef;border-radius:4px;overflow:hidden;">'
    +'<div style="height:100%;width:'+(state.current/TOTAL*100)+'%;background:'+opConf.color+';border-radius:4px;transition:width .4s;"></div>'
    +'</div>'
    +'<div style="font-family:\'Fredoka One\',sans-serif;font-size:14px;color:#adb5bd;">'+state.current+'/'+TOTAL+'</div>'
    +(state.streak>=2?'<div style="font-family:\'Fredoka One\',sans-serif;font-size:14px;color:#ffa94d;">🔥'+state.streak+'</div>':'')
    +'</div>';

  // Dots
  html += '<div style="display:flex;justify-content:center;gap:5px;margin-bottom:14px;">';
  for (var i=0;i<TOTAL;i++) {
    var dotColor = i<state.current ? (i<state.oiged?opConf.color:'#ff6b6b') : (i===state.current?opConf.color+'60':'#e9ecef');
    html += '<div style="width:9px;height:9px;border-radius:50%;background:'+dotColor+';transition:background .3s;"></div>';
  }
  html += '</div>';

  // Question card
  var borderColor = state.animState==='correct'?'#51cf66':state.animState==='wrong'?'#ff6b6b':opConf.color+'35';
  html += '<div id="qcard" style="background:#fff;border-radius:28px;padding:28px 20px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.08);margin-bottom:18px;border:3px solid '+borderColor+';transition:border-color .2s;"'
    +(state.animState==='wrong'?' class="shake-el"':'')+' >';

  // Visuaal (apples) for level 1
  if (t.visuaal && state.valitud===null) {
    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:200px;margin:0 auto 8px;">';
    var appleEmojis = ['🍎','🍊','🍋','🍇','🍓','⭐'];
    var icon = appleEmojis[q.a % appleEmojis.length];
    var count = Math.min(q.a, 12);
    for (var i=0;i<count;i++) html += '<span style="font-size:22px;">'+icon+'</span>';
    html += '</div>';
    if (q.op==='+') {
      var icon2 = appleEmojis[q.b % appleEmojis.length];
      var count2 = Math.min(q.b, 12);
      html += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:200px;margin:0 auto 8px;">';
      for (var i=0;i<count2;i++) html += '<span style="font-size:22px;">'+icon2+'</span>';
      html += '</div>';
    }
  }

  html += '<div style="font-family:\'Fredoka One\',sans-serif;font-size:52px;color:#2d2d2d;letter-spacing:2px;">'+q.a+' '+q.op+' '+q.b+' = ?</div>';
  if (state.animState==='correct') html += '<div style="font-family:\'Fredoka One\',sans-serif;font-size:22px;color:#51cf66;margin-top:10px;">✅ ÕIGE! = '+q.vastus+'</div>';
  if (state.animState==='wrong') html += '<div style="font-family:\'Fredoka One\',sans-serif;font-size:22px;color:#ff6b6b;margin-top:10px;">❌ VALE! VASTUS ON '+q.vastus+'</div>';
  html += '</div>';

  // Answer buttons
  var ansEmojis = ['🐱','🐶','🦊','🐸','🐼','🦄','🐨','🐰','🦋','🌟'];
  html += '<div class="grid2">';
  state.valikud.forEach(function(v, vi) {
    var pastelBgs = ['linear-gradient(135deg,#fce4ff,#f5d0ff)','linear-gradient(135deg,#ffe4ec,#ffd0dc)','linear-gradient(135deg,#dcf8ff,#c8efff)','linear-gradient(135deg,#dcffe8,#c8f7d4)'];
    var pastelBorders = ['#d884e8','#ff8fab','#5bc8e8','#6bcf8a'];
    var bg = pastelBgs[vi % 4];
    var border = '3px solid '+pastelBorders[vi % 4];
    var tc = '#3d2c5e';
    if (state.valitud!==null) {
      if (v===q.vastus) { bg='linear-gradient(135deg,#d3f9d8,#b8f0c4)'; border='3px solid #51cf66'; tc='#1a7a36'; }
      else if (v===state.valitud) { bg='linear-gradient(135deg,#ffe3e3,#ffc8c8)'; border='3px solid #ff6b6b'; tc='#c92a2a'; }
      else { bg='#f8f8f8'; border='3px solid #e9ecef'; tc='#adb5bd'; }
    }
    var emoji = (state.valitud===null) ? ansEmojis[vi] : (v===q.vastus ? '✅' : (v===state.valitud ? '❌' : ''));
    html += '<button class="answer-btn" onclick="vali('+v+')" '+(state.valitud!==null?'disabled':'')+' style="background:'+bg+';border:'+border+';color:'+tc+';box-shadow:0 5px 16px rgba(0,0,0,.1);flex-direction:column;gap:2px;padding:16px 8px;">'
      +'<span style="font-size:26px;">'+emoji+'</span>'
      +'<span style="font-size:34px;font-family:\'Fredoka One\',sans-serif;">'+v+'</span>'
      +'</button>';
  });
  html += '</div>';

  div.innerHTML = html;
  app.appendChild(div);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function selectTase(i) {
  state.selTase = TASEMED[i];
  if (state.selTase.tyyp==='numbrid') {
    state.screen='game'; state.numSubscreen=null; state.numIdx=0; state.numFlipped=false;
  } else {
    state.screen='opselect';
  }
  render();
}

function selectOp(op) {
  state.selOp = op;
  state.screen = 'game';
  initGame();
  render();
}

function initGame() {
  var TOTAL=10;
  state.questions = [];
  for (var i=0;i<TOTAL;i++) state.questions.push(state.selTase.gen(state.selOp));
  state.current=0; state.valitud=null; state.animState=null;
  state.oiged=0; state.streak=0; state.maxStreak=0; state.done=false;
  makeChoices();
}

function makeChoices() {
  var q = state.questions[state.current];
  if (!q) return;
  var correct = q.vastus;
  var pool = [correct];
  var tries=0;
  while (pool.length<4 && tries<60) {
    tries++;
    var delta = Math.floor(Math.random()*7)-3;
    var v = correct+delta;
    if (v>0 && pool.indexOf(v)===-1) pool.push(v);
  }
  var extra=1;
  while (pool.length<4) { if (pool.indexOf(correct+extra)===-1&&correct+extra>0) pool.push(correct+extra); extra++; }
  state.valikud = pool.sort(function(){return Math.random()-.5;});
}

function vali(v) {
  if (state.valitud!==null) return;
  state.valitud = v;
  var q = state.questions[state.current];
  var correct = v===q.vastus;
  if (correct) {
    playSound('correct'); state.animState='correct'; state.oiged++;
    var ns=state.streak+1; state.streak=ns;
    if (ns>state.maxStreak) state.maxStreak=ns;
    var xpAmt=ns>=3?3:2;
    addXp(xpAmt, state.selTase.ops ? (state.selOp==='mõlemad'?state.selTase.color:state.selTase.ops.find(function(o){return o.id===state.selOp;}).color) : state.selTase.color);
  } else {
    playSound('wrong'); state.animState='wrong'; state.streak=0;
  }
  render();
  setTimeout(function() {
    if (state.current+1 < 10) {
      state.current++; state.valitud=null; state.animState=null;
      makeChoices();
    } else {
      state.done=true;
      if (state.oiged>=8) { playSound('levelup'); state.showConf=true; if(state.confTimer)clearTimeout(state.confTimer); state.confTimer=setTimeout(function(){state.showConf=false;render();},2600); }
    }
    render();
  }, 950);
}

function addXp(amount, color) {
  var prev=state.xp, next=prev+amount;
  state.xp=next;
  localStorage.setItem('mat_xp',next);
  if (getLevel(next).min > getLevel(prev).min) { playSound('levelup'); state.showConf=true; if(state.confTimer)clearTimeout(state.confTimer); state.confTimer=setTimeout(function(){state.showConf=false;render();},2600); }
  // XP popup
  var popup=document.createElement('div');
  popup.style.cssText='position:fixed;top:35%;left:50%;transform:translateX(-50%);background:'+color+';color:#fff;border-radius:24px;padding:10px 28px;font-family:\'Fredoka One\',sans-serif;font-size:24px;z-index:9998;pointer-events:none;animation:xpFloat 1.1s ease forwards;box-shadow:0 4px 20px rgba(0,0,0,.18);';
  popup.textContent='+'+amount+' XP ✨';
  document.body.appendChild(popup);
  setTimeout(function(){popup.remove();},1100);
}

function flipCard() {
  playSound('flip');
  state.numFlipped = !state.numFlipped;
  render();
}

function numNext() {
  playSound('flip');
  state.numFlipped=false;
  var g = getNumGroup();
  if (state.numIdx<g.to) { state.numIdx++; render(); }
  else { addXp(10,'#845ef7'); state.showConf=true; if(state.confTimer)clearTimeout(state.confTimer); state.confTimer=setTimeout(function(){state.showConf=false;state.numSubscreen=null;render();},2600); render(); }
}

function numPrev() {
  var g = getNumGroup();
  if (state.numIdx<=g.from) return;
  playSound('flip'); state.numFlipped=false; state.numIdx--; render();
}

function restartGame() {
  initGame(); render();
}

function goBack() {
  if (state.numSubscreen) { state.numSubscreen=null; render(); return; }
  if (state.screen==='game' && state.selTase.tyyp!=='numbrid') { state.screen='opselect'; }
  else { state.screen='home'; }
  render();
}

// ── Start ─────────────────────────────────────────────────────────────────────
render();
</script>
